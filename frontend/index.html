<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4338ca" />
    <title>Hostel Management</title>
    <!-- Stamps the dark/light class on <html> before the first paint, from
         the same source ThemeContext.tsx reads on mount (localStorage, then
         OS preference) — without this, the page would render light for one
         frame and then flash to dark. Inline and synchronous on purpose. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('hostel_theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
